# Two alternative examples; only `tain-proxmox` starts by default.
#   docker compose up -d                  # tain-proxmox: one upstream via env vars
#   docker compose --profile multi up -d  # also tain-multi: several upstreams from TOML
# Each service has its own data dir: two tain instances must never share one.
# Adjust image tag, `user:` and volumes. The image's default command is `daemon`.
# Create each data dir first, owned by the `user:` uid (the image does no chown),
# e.g. `mkdir mirrors-proxmox && chown 1000:1000 mirrors-proxmox`. `up` fails
# if it is missing instead of creating it root-owned.
# On stop the daemon finishes its in-flight sync; a kill after stop_grace_period
# is safe, since an interrupted sync never touches the published tree.
#
# Health check: `tain status --healthy-within` measures the age of the upstream
# Release Date of the suite in the most recently published generation, not the
# time of the last sync. A quiet upstream ages however often tain runs, so pick
# a window longer than the upstream's longest gap between updates. The check also fails while
# nothing has been published yet; start_period covers the first full sync.

services:
  tain-proxmox:
    image: ghcr.io/channinghe/tain:latest
    user: "1000:1000"
    environment:
      TAIN_URL: "http://download.proxmox.com/debian/pve"
      TAIN_DISTS: "trixie|pve-no-subscription|amd64"
      # Published at ./mirrors-proxmox/proxmox; serve ./mirrors-proxmox.
      TAIN_PATH: "proxmox"
      TAIN_GC: "1"
      # Container local time: UTC unless TZ is set (e.g. TZ: "Europe/Berlin").
      TAIN_SCHEDULE: "20 23,6,12,20 * * *"
    volumes:
      - type: bind
        source: ./mirrors-proxmox
        target: /data
        bind:
          create_host_path: false
    restart: unless-stopped
    stop_grace_period: 5m
    healthcheck:
      test: ["CMD", "tain", "status", "--healthy-within", "30d"]
      start_period: 24h
      interval: 5m
      timeout: 10s
      retries: 3

  # Create ./config/tain.toml first, with `global.target = "/data"` and
  # `global.schedule`; see README.md. Without ./config, `up` fails rather than
  # creating an empty root-owned directory. A missing or invalid tain.toml makes
  # the daemon exit non-zero; docker retries with backoff, so check
  # `docker compose logs tain-multi` if it keeps restarting.
  tain-multi:
    profiles: ["multi"]
    image: ghcr.io/channinghe/tain:latest
    user: "1000:1000"
    environment:
      TAIN_CONFIG: "/config/tain.toml"
    volumes:
      - type: bind
        source: ./mirrors-multi
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./config
        target: /config
        read_only: true
        bind:
          create_host_path: false
    # Not on-failure:N: the daemon exits 0 when docker stops it, so on-failure
    # would leave it down after a host reboot.
    restart: unless-stopped
    stop_grace_period: 5m
    healthcheck:
      test: ["CMD", "tain", "status", "--healthy-within", "30d"]
      start_period: 24h
      interval: 5m
      timeout: 10s
      retries: 3
