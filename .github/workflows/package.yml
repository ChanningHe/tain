name: package

# Builds and checks every release artifact, publishing nothing: static
# binaries, tarballs, .debs and the container image. ci.yml runs it on every
# change so packaging breaks before a tag does; release.yml publishes the
# artifacts it uploads.
on:
  workflow_call:
    inputs:
      image-variants:
        description: JSON list of Dockerfile.release VARIANTs to build
        type: string
        default: '["release"]'

permissions:
  contents: read

# Explicit bash = `bash -eo pipefail`.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  # Static musl binaries from the nix devshell; zig cross-links arm64.
  binaries:
    name: build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: tain-linux-amd64
          - target: aarch64-unknown-linux-musl
            asset: tain-linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build static binary
        run: nix develop --command cargo zigbuild --release --locked --target ${{ matrix.target }}

      # Offline: every crate for both targets is in the cargo cache after the
      # fetch, so the result does not depend on a web service.
      - name: Third-party licenses
        run: |
          nix develop --command cargo fetch --locked
          nix develop --command cargo about generate --frozen --fail about.hbs -o THIRD-PARTY-LICENSES

      - name: Package tarball
        env:
          ASSET: ${{ matrix.asset }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "dist-out/$ASSET/docs"
          cp "target/$TARGET/release/tain" README.md LICENSE THIRD-PARTY-LICENSES "dist-out/$ASSET/"
          cp docs/configuration.md "dist-out/$ASSET/docs/"
          cp -r dist/systemd "dist-out/$ASSET/"
          cd dist-out
          tar czf "$ASSET.tar.gz" "$ASSET"
          sha256sum "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist-out/${{ matrix.asset }}.tar.gz*

  # Packages the exact binary from each tarball instead of rebuilding.
  deb:
    name: build .deb (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: binaries
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tain-linux-${{ matrix.arch }}
          path: bin-in
      - name: Stage binary where cargo-deb expects it
        run: |
          tar xzf "bin-in/tain-linux-$ARCH.tar.gz" -C bin-in
          install -D -m 755 "bin-in/tain-linux-$ARCH/tain" "target/$TARGET/release/tain"
      # With --target, cargo-deb maps `target/release/` assets to the staged
      # path and the Debian architecture to amd64/arm64.
      - name: cargo deb
        run: nix develop --command cargo deb --no-build --target "$TARGET" --output deb-out/
      - name: Add licenses, changelog and md5sums
        env:
          RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases
        run: |
          sh .github/scripts/deb-finalize.sh deb-out/tain_*_"$ARCH".deb \
            "bin-in/tain-linux-$ARCH/THIRD-PARTY-LICENSES" "$RELEASES_URL"
      - name: lintian
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends lintian
          lintian --fail-on error --info deb-out/*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tain-deb-${{ matrix.arch }}
          path: deb-out/*.deb

  # Run the shipped tarball and .deb on their own architecture, the way a
  # user would: checksum, unpack, execute; install, execute, purge.
  smoke:
    name: smoke ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: [binaries, deb]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ASSET: tain-linux-${{ matrix.arch }}
      TAIN_URL: http://deb.example.invalid/debian
      TAIN_DISTS: "bookworm|main|amd64"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tain-linux-${{ matrix.arch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tain-deb-${{ matrix.arch }}
      - name: Tarball
        run: |
          sha256sum -c "$ASSET.tar.gz.sha256"
          tar xzf "$ASSET.tar.gz"
          file "$ASSET/tain" | tee /dev/stderr | grep -qE 'static(ally|-pie) linked'
          "./$ASSET/tain" --version
          # Env-only config; check makes no network requests.
          "./$ASSET/tain" check
      - name: .deb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ./tain_*.deb
          tain --version
          test -s /var/lib/dpkg/info/tain.md5sums
          # dpkg --verify exits 0 on mismatches; it only prints them.
          test -z "$(dpkg --verify tain)"
          test -s /usr/share/doc/tain/THIRD-PARTY-LICENSES
          sudo apt-get purge -y -q tain

  # The release image for both platforms, not pushed (release.yml pushes it).
  image:
    name: image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: binaries
    strategy:
      matrix:
        variant: ${{ fromJSON(inputs.image-variants) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tain-linux-*
          path: dl
      - name: Assemble build context
        run: sh .github/scripts/image-context.sh dl image
      # COPY-only Dockerfile: no RUN, so no QEMU is needed for arm64.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "VARIANT=$VARIANT" -f docker/Dockerfile.release image
