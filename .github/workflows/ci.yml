name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fmt-clippy:
    name: fmt + clippy (both feature configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: cargo fmt --check
        run: nix develop --command cargo fmt --check
      - name: cargo clippy (default features)
        run: nix develop --command cargo clippy --all-targets --locked -- -D warnings
      - name: cargo clippy (no default features)
        run: nix develop --command cargo clippy --all-targets --no-default-features --locked -- -D warnings

  # Known advisories fail CI; justified exceptions live in .cargo/audit.toml.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: cargo audit
        run: nix develop --command cargo audit

  test-linux-amd64:
    name: test (linux-amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: cargo test (default features)
        run: nix develop --command cargo test --locked
      - name: cargo test (no default features)
        run: nix develop --command cargo test --locked --no-default-features

  # Every release artifact (binaries, tarballs, .debs, image), not published.
  package:
    uses: ./.github/workflows/package.yml
