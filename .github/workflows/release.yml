name: release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual runs are dry runs: build everything, push and publish nothing.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: version check + fmt/clippy/test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve versions
        id: version
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: DeterminateSystems/nix-installer-action@v23
      - name: cargo fmt --check
        run: nix develop --command cargo fmt --check
      - name: cargo clippy (default features)
        run: nix develop --command cargo clippy --all-targets --locked -- -D warnings
      - name: cargo clippy (no default features)
        run: nix develop --command cargo clippy --all-targets --no-default-features --locked -- -D warnings
      - name: cargo test (default features)
        run: nix develop --command cargo test --locked
      - name: cargo test (no default features)
        run: nix develop --command cargo test --locked --no-default-features

  # docker/Dockerfile's `binary` stage; the image job repackages these binaries.
  binaries:
    name: build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    needs: gate
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            asset: tain-linux-amd64
          - platform: linux/arm64
            asset: tain-linux-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build static binary
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: binary
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=bin-out
          cache-from: type=gha,scope=${{ matrix.asset }}
          cache-to: type=gha,mode=max,scope=${{ matrix.asset }}

      - name: Package tarball
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p "dist-out/$ASSET"
          cp bin-out/tain README.md LICENSE "dist-out/$ASSET/"
          cp -r dist/systemd "dist-out/$ASSET/"
          cd dist-out
          tar czf "$ASSET.tar.gz" "$ASSET"
          sha256sum "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist-out/${{ matrix.asset }}.tar.gz*

  # Packages the exact binary from the amd64 tarball instead of rebuilding.
  deb:
    name: build .deb
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: actions/download-artifact@v8
        with:
          name: tain-linux-amd64
          path: bin-in
      - name: Stage binary where cargo-deb expects it
        run: |
          tar xzf bin-in/tain-linux-amd64.tar.gz -C bin-in
          install -D -m 755 bin-in/tain-linux-amd64/tain target/x86_64-unknown-linux-musl/release/tain
      - run: cargo install --locked cargo-deb --version 3.8.0
      # With --target, cargo-deb maps `target/release/` assets to the staged path.
      - run: cargo deb --no-build --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v7
        with:
          name: tain-deb
          path: target/x86_64-unknown-linux-musl/debian/*.deb

  docker:
    name: docker image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: [gate, binaries]
    strategy:
      matrix:
        # debug = same image plus busybox, tagged *-debug.
        variant: [release, debug]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: tain-linux-*
          path: dl
      - name: Assemble build context
        run: |
          mkdir -p image/data
          for arch in amd64 arm64; do
            mkdir -p "image/$arch"
            tar xzf "dl/tain-linux-$arch/tain-linux-$arch.tar.gz" -C "image/$arch" \
              --strip-components=1 "tain-linux-$arch/tain"
          done
      # COPY-only Dockerfile: no RUN, so no QEMU is needed for arm64.
      - uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: suffix=${{ matrix.variant == 'debug' && '-debug' || '' }},onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ needs.gate.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.gate.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.gate.outputs.version }}

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on tag)
        uses: docker/build-push-action@v7
        with:
          context: image
          file: docker/Dockerfile.release
          build-args: VARIANT=${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    name: publish GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [binaries, deb, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist-out
      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist-out/tain-linux-amd64/tain-linux-amd64.tar.gz*
            dist-out/tain-linux-arm64/tain-linux-arm64.tar.gz*
            dist-out/tain-deb/*.deb
